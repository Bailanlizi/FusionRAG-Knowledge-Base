name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pydantic pydantic-settings python-dotenv pyyaml numpy tiktoken pytest tenacity httpx sqlalchemy
          pip install -r requirements.txt || true

      - name: Run tests (mock mode)
        env:
          USE_MOCK: "true"
          DASHSCOPE_API_KEY: mock-key
        run: pytest tests/ -q
